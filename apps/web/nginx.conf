# Example: deploy apps/web/dist to /srv/acp/web, then include this server block.
# Adjust server_name, root and the core-api upstream for the deployment host.
server {
    listen 80;
    server_name localhost;
    root /srv/acp/web;
    index index.html;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # The trailing slash strips /api/; core-api keeps its existing routes.
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
