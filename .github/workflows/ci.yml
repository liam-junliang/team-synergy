name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, lint & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 测试库连接串。库名必须是 acp_test：ensureTestDatabase() 以该 URL 的库名
      # 判断是否 CREATE DATABASE（不存在才建），绝不能指向 service 的管理库
      # postgres，否则测试迁移+TRUNCATE 会清空管理库。
      ACP_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/acp_test

    steps:
      - uses: actions/checkout@v4

      - name: Check commit message
        run: node scripts/check-commit-message.mjs --rev HEAD

      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段固定

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      # 测试必须串行：多个 workspace 共享同一测试库，并行会互相清库
      - name: Test
        run: pnpm -r --workspace-concurrency=1 test
