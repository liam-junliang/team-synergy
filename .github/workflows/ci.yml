name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, lint & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tsp_test_admin
          POSTGRES_PASSWORD: ci_test_cluster_bootstrap_only_2026
          POSTGRES_DB: postgres
          PGPORT: '55432'
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256
        ports:
          - 55432:55432
        options: >-
          --health-cmd "pg_isready -U tsp_test_admin -p 55432"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Fresh service container only. The provisioner creates a non-superuser
      # test identity and pins the cluster identifier; tests never use this admin.
      TSP_TEST_BOOTSTRAP_PASSWORD: ci_test_cluster_bootstrap_only_2026

    steps:
      - uses: actions/checkout@v4

      - name: Check commit message
        run: node scripts/check-commit-message.mjs --rev HEAD

      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段固定

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision isolated test PostgreSQL identity
        run: node scripts/provision-test-postgres.mjs --ci

      - name: Migration policy
        run: pnpm migration:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Verify database test isolation
        run: pnpm test:db:check

      # 测试必须串行：多个 workspace 共享同一测试库，并行会互相清库
      - name: Test
        run: pnpm test

      - name: Populated isolated integrity fixture gate
        run: node scripts/run-tests.mjs -- node scripts/check-orphans-ci.mjs
