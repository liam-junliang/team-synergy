map $https $security_hsts {
    default "";
    on "max-age=31536000";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security $security_hsts always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
    # Change this header name to Content-Security-Policy only after the report window is reviewed.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' https:; report-uri /api/security/csp-report" always;
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
    }
    location /assets/ { try_files $uri =404; }
    location ~ ^/agent/guide\.(zh-CN|en-US)\.md$ {
        types { text/markdown md; }
        charset utf-8;
        charset_types text/markdown;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
